[package]
name = "orderhub-redis-tls-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace]

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
nautilus-infrastructure = { path = "../../crates/infrastructure", default-features = false, features = ["redis"] }
redis = { version = "=1.7.0", default-features = false, features = [
  "connection-manager",
  "sentinel",
  "streams",
  "tokio-comp",
  "tokio-rustls-comp",
  "tls-rustls",
  "tls-rustls-webpki-roots",
] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "=0.4.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12"] }
