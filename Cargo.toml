[workspace]
resolver = "2"
exclude = ["patches/criterion-0.7.0"]
members = [
  "crates/common",
  "crates/core",
  "crates/cryptography",
  "crates/data",
  "crates/execution",
  "crates/infrastructure",
  "crates/macros",
  "crates/model",
  "crates/orderhub-gateway",
  "crates/orderhub-node",
  "crates/orderhub-proto",
  "crates/orderhub-tools",
  "crates/portfolio",
  "crates/risk",
  "crates/testkit"]

[workspace.package]
version = "0.65.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["Nautech Systems"]
categories = ["finance", "simulation", "asynchronous"]
keywords = [
  "finance",
  "trading",
  "trading-platform",
  "algorithmic-trading",
  "quantitative-finance"]
documentation = "https://github.com/kmind-git/nautilus_trader"
repository = "https://github.com/kmind-git/nautilus_trader"
homepage = "https://github.com/kmind-git/nautilus_trader"

[workspace.dependencies]
nautilus-common = { path = "crates/common", version = "0.65.0" }
nautilus-core = { path = "crates/core", version = "0.65.0" }
nautilus-execution = { path = "crates/execution", version = "0.65.0" }
nautilus-infrastructure = { path = "crates/infrastructure", version = "0.65.0", default-features = false }
nautilus-macros = { path = "crates/macros", version = "0.65.0" }
nautilus-model = { path = "crates/model", version = "0.65.0" }
nautilus-portfolio = { path = "crates/portfolio", version = "0.65.0" }
nautilus-risk = { path = "crates/risk", version = "0.65.0" }

# -----------------------------------------------------------------------------
# Core dependencies
#
# - arrow and parquet versions stay aligned for the optional offline converter
# -----------------------------------------------------------------------------
ahash = { version = "0.8.12", features = ["serde"] }
alloy-primitives = { version = "1.7.3", default-features = false, features = [
  "std",
  "serde",
] }
anyhow = "1.0.104"
arc-swap = "1.9.2"
arrow = { version = "59.3.0", default-features = false, features = [
  "ipc",
] }
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
bon = "3.9.3"
bytes = { version = "1.12.1", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dashmap = "6.2.1"
derive_builder = { version = "0.20.2", default-features = false, features = [
  "alloc",
] }
ed25519-dalek = "3.0.0"
enum_dispatch = "0.3.13"
futures = { version = "0.3.34", default-features = false, features = [
  "std",
  "async-await",
] }
hmac = "0.13.0"
implied-vol = { version = "2.0.0" }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.37", default-features = false, features = [
  "perf-inline",
  "serde",
  "std",
  "tz-fat",
  "tzdb-bundle-always",
] }
libc = "0.2.189"
log = { version = "0.4.34", features = [
  "std",
  "kv_unstable",
  "serde",
  "release_max_level_debug",
] }
madsim = { version = "0.2.34", default-features = false, features = ["macros"] }
parking_lot = "0.12.5"
parquet = { version = "59.3.0", default-features = false, features = [
  "arrow",
] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = { version = "0.10.2", default-features = false, features = [
  "std",
  "thread_rng",
] }
redb = { version = "4.3.0", default-features = false }
redis = { version = "1.7.0", default-features = false, features = [
  "connection-manager",
  "sentinel",
  "streams",
  "tokio-comp",
  "tokio-rustls-comp",
  "tls-rustls",
  "tls-rustls-webpki-roots",
] }
regex = { version = "1.13.1", default-features = false, features = [
  "std",
  "perf",
  "unicode-perl",
] }
rmp-serde = "1.3.1"
ruint = { version = "1.20.1", default-features = false }
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
  "rc",
] }
serde_json = { version = "1.0.151", default-features = false, features = [
  "raw_value",
  "std",
] }
sha2 = "0.11.0"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "=0.4.0"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12"] }
smallvec = { version = "1.16.1", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "json",
  "derive",
  "rust_decimal",
] }
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.4", features = ["full"] }
sysinfo = { version = "0.39.6", default-features = false, features = [
  "system",
] }
tabled = { version = "0.22.0", default-features = false, features = ["std"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
  "parking_lot",
  "rt-multi-thread",
  "sync",
  "fs",
  "io-util",
  "net",
  "time",
  "macros",
  "signal",
] }
toml = { version = "1.1.6", default-features = false, features = [
  "parse",
  "serde",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "std",
  "env-filter",
  "fmt",
  "registry",
] }
ustr = { version = "1.1.0", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = { version = "1.9.0", features = ["alloc", "zeroize_derive"] }

# -----------------------------------------------------------------------------
# Dev dependencies
# -----------------------------------------------------------------------------
axum = { version = "0.8.9", default-features = false, features = [
  "tokio",
  "http1",
  "json",
  "query",
  "ws",
] }
criterion = { version = "=0.7.0", default-features = false, features = [
  "cargo_bench_support",
] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rstest = { version = "0.27.0", default-features = false }
tempfile = "3.27.0"

# -----------------------------------------------------------------------------
# Build dependencies
# -----------------------------------------------------------------------------

[patch.crates-io]
criterion = { path = "patches/criterion-0.7.0" }
sqlx = { path = "patches/sqlx-0.9.0/sqlx" }
sqlx-core = { path = "patches/sqlx-0.9.0/sqlx-core" }
sqlx-macros = { path = "patches/sqlx-0.9.0/sqlx-macros" }
sqlx-macros-core = { path = "patches/sqlx-0.9.0/sqlx-macros-core" }
parquet = { path = "patches/parquet-59.3.0" }
blake3 = { path = "patches/blake3-1.8.7" }

# -----------------------------------------------------------------------------
# Tools (for cargo install, used by Makefile and CI)
# -----------------------------------------------------------------------------
[workspace.metadata.tools]
cargo-fuzz = "0.13.2"
cargo-hawk = "0.1.14"
cargo-machete = "0.9.2"
cbindgen = "0.29.4"
flamegraph = "0.6.14"
lychee = "0.24.2"

# cargo-vet supply chain security configuration
[workspace.metadata.vet]
store = { path = '.supply-chain' }

# Minimum age before a crate version may enter Cargo.lock, approximating uv's
# `exclude-newer` for Cargo. Enforced by scripts/check-cargo-cooldown.sh.
[workspace.metadata.cooldown]
days = 3

[workspace.metadata.cooldown.allow]
rustls = "0.23.45" # Fixes RUSTSEC-2026-0285

# -----------------------------------------------------------------------------
# Profiles
# -----------------------------------------------------------------------------
[profile.dev]
opt-level = 0
debug = false # Improves compile times
debug-assertions = false
overflow-checks = false # test profile keeps these on for catching overflow bugs
strip = "debuginfo" # Improves compile times
lto = false
panic = "unwind"
incremental = true

# Compile third-party deps at opt-level=1 in dev/test profiles. Workspace
# members keep opt-level=0 (fast iteration); deps recompile rarely so the
# small one-off compile cost pays off in faster test/run loops.
[profile.dev.package."*"]
opt-level = 1

[profile.test]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
strip = false
lto = false
incremental = true

[profile.test.package."*"]
opt-level = 1

[profile.nextest]
inherits = "test"
debug = false # Improves compile times
strip = "debuginfo" # Improves compile times
incremental = false # Bounds local validation cache size

[profile.ci-pr]
inherits = "test"
opt-level = 0
debug = false
strip = "debuginfo"
lto = false
incremental = false
codegen-units = 1

[profile.ci-pr.package."*"]
opt-level = 0

[profile.ci-pr-wheel]
inherits = "dev"
debug = false
strip = "debuginfo"
incremental = false
codegen-units = 1

[profile.ci-pr-wheel.package."*"]
opt-level = 0

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
strip = "symbols"
panic = "abort"
incremental = false
codegen-units = 1

[profile.release-debugging]
inherits = "release"
incremental = true
debug = "full"
strip = false
lto = false

# -----------------------------------------------------------------------------
# Benchmarks
# -----------------------------------------------------------------------------
# Criterion benchmarks should retain debug symbols so that tools like
# `cargo flamegraph` or `perf` produce human-readable stack traces. We inherit
# from `release` (opt-level 3) and set `debug = "full"` to preserve symbols;
# LTO is disabled for faster bench compile times.
# -----------------------------------------------------------------------------

[profile.bench]
inherits = "release"
debug = "full"
strip = false
lto = false
incremental = true
# Cargo ignores `panic` for bench profile (harness requires unwind to catch failures)

# -----------------------------------------------------------------------------
# Published-benchmark profile
# -----------------------------------------------------------------------------
# Use for any reported or published benchmark numbers: PR description headline
# tables, release-note figures, per-adapter `BENCHMARKS.md` files, and any
# other numbers quoted outside an ad-hoc developer-laptop comparison. Matches
# the production release profile (`lto = "fat"`, `codegen-units = 1`) while
# keeping debug symbols for profilers. Pair with `setarch -R` (ASLR off) and a
# CPU governor set to `performance` for the tightest, most reproducible
# figures.
#
#   sudo cpupower frequency-set -g performance
#   setarch -R cargo bench --profile bench-lto -p <crate> --bench <name>
# -----------------------------------------------------------------------------

[profile.bench-lto]
inherits = "release"
debug = "full"
strip = false
lto = "fat"
incremental = false
codegen-units = 1

# -----------------------------------------------------------------------------
# Workspace lints
# -----------------------------------------------------------------------------
# Centralized lint configuration for all workspace crates.
# Individual crates inherit these with: [lints] workspace = true
#
# These lints are auto-fixable and enforced in pre-commit hooks.
# Run `make clippy-fix` to auto-fix most issues.
#
# Use `make clippy-strict-audit` to report candidate strict lints without
# changing the required workspace gate.
# -----------------------------------------------------------------------------

[workspace.lints.clippy]
# Debug markers
dbg_macro = "warn"

# Performance optimizations
redundant_clone = "warn"
unnecessary_to_owned = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"

# Needless code
needless_borrow = "warn"
needless_bool = "warn"
needless_borrows_for_generic_args = "warn"
needless_collect = "warn"
needless_continue = "warn"
needless_late_init = "warn"
needless_lifetimes = "warn"
needless_match = "warn"
needless_option_as_deref = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_range_loop = "warn"
needless_raw_strings = "warn"
needless_raw_string_hashes = "warn"
needless_return = "warn"
needless_update = "warn"

# Code simplification
redundant_closure = "warn"
# redundant_closure_for_method_calls = "warn" # Pending adapter cleanup; pedantic crates already enable it
collapsible_if = "warn"
collapsible_else_if = "warn"
useless_conversion = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_semicolon = "warn"
unnecessary_sort_by = "warn"
unnecessary_struct_initialization = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_wraps = "warn"
unnecessary_box_returns = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
map_identity = "warn"
if_same_then_else = "warn"
get_first = "warn"
single_char_pattern = "warn"
identity_op = "warn"

# Iterator simplifications
manual_flatten = "warn"
iter_kv_map = "warn"
bytes_count_to_len = "warn"
unnecessary_filter_map = "warn"

# Option/Result simplifications
unnecessary_lazy_evaluations = "warn"
option_as_ref_deref = "warn"

# Manual pattern simplifications
manual_filter = "warn"
manual_find = "warn"
manual_while_let_some = "warn"
range_plus_one = "warn"
checked_conversions = "warn"
manual_strip = "warn"
manual_split_once = "warn"
manual_is_ascii_check = "warn"
manual_range_contains = "warn"
manual_string_new = "warn"
manual_instant_elapsed = "warn"

# Pointer casts
ref_as_ptr = "warn"

# Style/idioms
use_self = "warn"
# default_trait_access = "warn" # TODO: Enable (~170 warnings)
redundant_field_names = "warn"
match_like_matches_macro = "warn"
manual_map = "warn"
bool_to_int_with_if = "warn"
explicit_iter_loop = "warn"
uninlined_format_args = "warn"

# Pedantic (explicitness and clarity)
borrow_as_ptr = "warn"
copy_iterator = "warn"
expl_impl_clone_on_copy = "warn"
inconsistent_struct_constructor = "warn"
iter_nth_zero = "warn"
map_flatten = "warn"
match_bool = "warn"
mut_mut = "warn"
naive_bytecount = "warn"
option_option = "warn"
ptr_as_ptr = "warn"
verbose_bit_mask = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
map_unwrap_or = "warn"
implicit_clone = "warn"
return_self_not_must_use = "warn"
explicit_into_iter_loop = "warn"
stable_sort_primitive = "warn"
needless_for_each = "warn"
manual_is_variant_and = "warn"
equatable_if_let = "warn"
manual_assert = "warn"
items_after_statements = "warn"
ignored_unit_patterns = "warn"
if_not_else = "warn"

# Security and robustness
disallowed_methods = "warn"
disallowed_types = "warn"
exit = "warn"
suspicious_doc_comments = "warn"
large_stack_arrays = "warn"
panic_in_result_fn = "warn"
unimplemented = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
unchecked_time_subtraction = "warn"

# Numeric correctness
float_cmp_const = "warn"
lossy_float_literal = "warn"
invalid_upcast_comparisons = "warn"

# API hygiene
rc_mutex = "warn"
rc_buffer = "warn"
empty_drop = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_not_returning_iterator = "warn"
infallible_try_from = "warn"
debug_assert_with_mut_call = "warn"

# Async correctness
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
let_underscore_future = "warn"
large_futures = "warn"
if_let_mutex = "warn"

# TODO: Don't fail silently. Incremental rollout needed (~1400 sites workspace-wide)
# let_underscore_must_use = "warn"
# unused_result_ok = "warn"
# assertions_on_result_states = "warn"
# map_err_ignore = "warn"

# Explicitly allowed (opinionated lints we disagree with)
redundant_else = "allow" # Sometimes explicit else blocks improve readability
single_match_else = "allow" # Match can be clearer than if-let-else for some patterns
manual_let_else = "allow" # Match can be clearer than let-else for some patterns
or_fun_call = "allow" # Used consistently for display with map_or("None".to_string(), ...)
option_if_let_else = "allow" # if-let can be clearer than map_or/map_or_else
similar_names = "allow" # Domain terms like trade/trader and side/size are intentionally similar

# TODO: Enable these incrementally (widespread usage in codebase)
# unwrap_used = "warn"        # Forces explicit error handling instead of panics
# expect_used = "warn"        # Forces explicit error handling instead of panics
# indexing_slicing = "warn"   # Prevents panics from out-of-bounds access

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(madsim)'] }
unreachable_pub = "deny"
unknown_lints = "allow" # Tolerate nightly-only clippy lint names in crate attributes on the pinned stable toolchain
