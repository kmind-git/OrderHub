# OrderHub supports one FIX 4.2 initiator session, not a full QuickFIX engine.
# Relative FileLogPath is resolved against this configuration file.
[DEFAULT]
ConnectionType=initiator
BeginString=FIX.4.2
HeartBtInt=30
Logging=Y
FileLogPath=../logs/fix
FileLogMaxBytes=10485760
FileLogBackups=5

[SESSION]
SenderCompID=ORDERHUB
TargetCompID=GOX
SocketConnectHost=127.0.0.1
SocketConnectPort=5001
