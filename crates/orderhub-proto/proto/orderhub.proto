// OrderHub API contract (M1).
//
// Conventions from the design contracts:
// - 64-bit sequence numbers and nanosecond timestamps travel as strings to
//   avoid JavaScript numeric precision loss.
// - Amounts and quantities are decimal strings; float/double are forbidden.
// - Four business RPCs only; snapshots resume via WatchEvents(after = cursor).

syntax = "proto3";

package orderhub.v1;

service OrderHub {
  rpc SubmitOrder(SubmitOrderRequest) returns (AdmissionResponse);
  rpc CancelOrder(CancelOrderRequest) returns (AdmissionResponse);
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream JournalEvent);
}

message SubmitOrderRequest {
  string submitter_id = 1;
  string request_id = 2;
  string strategy_id = 3;
  string instrument_id = 4;
  string side = 5;          // BUY | SELL
  string quantity = 6;      // decimal string
  string price = 7;         // decimal string
  string time_in_force = 8; // GTC | IOC | FOK
  bool post_only = 9;
  bool reduce_only = 10;
  optional uint64 submit_before_ns = 11;
  string journal_epoch = 12;
}

message CancelOrderRequest {
  string submitter_id = 1;
  string request_id = 2;
  string client_order_id = 3;
  string journal_epoch = 4;
}

message AdmissionResponse {
  string journal_epoch = 1;
  string seq = 2;
  string client_order_id = 3;
  bool already_admitted = 4;
  string result = 5; // ADMITTED | CANCEL_INTENT_ACCEPTED | ...
  string reason = 6;
}

message GetStateRequest {
  oneof query {
    SnapshotQuery snapshot = 1;
    OrderLookup order_lookup = 2;
    RequestLookup request_lookup = 3;
  }
}

message SnapshotQuery {
  uint32 page_size = 1;
  string page_token = 2;
}

message OrderLookup { repeated string client_order_ids = 1; }
message RequestLookup {
  string rpc_method = 1;
  string request_id = 2;
  string journal_epoch = 3;
}

message OrderView {
  string client_order_id = 1;
  string strategy_id = 2;
  string instrument_id = 3;
  string side = 4;
  string quantity = 5;
  string price = 6;
  string status = 7;
  string filled_quantity = 8;
  string remaining_quantity = 9;
  string account_id = 10;
  string fees = 11;
  string version = 12;
}

message InstrumentInfo {
  string instrument_id = 1;
  string price_increment = 2;
  string size_increment = 3;
  uint32 price_precision = 4;
}

message GetStateResponse {
  string journal_epoch = 1;
  string state_cursor = 2;
  bool writable = 3;
  repeated OrderView active_orders = 4;
  repeated InstrumentInfo instruments = 5;
  string readiness = 6;
  string snapshot_id = 7;
  string next_page_token = 8;
  string resume_token = 9;
  AdmissionResponse request_result = 10;
  bool stale = 11;
  repeated PositionView positions = 12;
  repeated AccountView accounts = 13;
  repeated InputFact inputs = 14;
  ControlFact committed_health = 15;
}

message PositionView {
  string strategy_id = 1;
  string instrument_id = 2;
  string quantity = 3;
  string cost = 4;
  string reserved_quantity = 5;
}

message AccountView {
  string account_id = 1;
  string reserved_cash = 2;
  string spent_cash = 3;
  string strategy_id = 4; // this is the authorized strategy ledger, not total account funds
}

message CommittedView {
  OrderView order = 1;
  PositionView position = 2;
  AccountView account = 3;
}

message InputFact { string json = 1; }

message WatchEventsRequest {
  string after = 1; // resume cursor: journal seq already applied
  string journal_epoch = 2;
  string resume_token = 3;
}

message JournalEvent {
  string seq = 1;
  string journal_epoch = 2;
  oneof kind {
    AdmissionEvent admission = 3;
    OutcomeEvent outcome = 4;
    ProgressEvent progress = 5;
    ExecutionFact execution = 8;
    InputFact input = 9;
    ControlFact control = 10;
  }
  string event_id = 6;
  string resume_token = 7;
  CommittedView view = 11;
}

message ControlFact {
  string readiness = 1;
  bool writable = 2;
  optional bool connected = 3;
  string reason = 4;
}

message ExecutionFact {
  string event_id = 1;
  string trade_id = 2;
  string client_order_id = 3;
  string strategy_id = 4;
  string account_id = 5;
  string instrument_id = 6;
  string kind = 7;
  string quantity = 8;
  string price = 9;
  string fee = 10;
  string currency = 11;
  string event_time_ns = 12;
}

message AdmissionEvent {
  string submitter_id = 1;
  string request_id = 2;
  string strategy_id = 3;
  string instrument_id = 4;
  string request_kind = 5; // SubmitOrder | CancelOrder
}

message OutcomeEvent {
  string origin_seq = 1;
  string client_order_id = 2;
  string outcome = 3; // ADMITTED | DENIED | DISPATCH_STARTED | CANCEL_INTENT
  string reason = 4;
}

message ProgressEvent {
  string state_cursor = 1;
}
