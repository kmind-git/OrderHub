[package]
autoexamples = false
name = "nautilus-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Nautech Systems"]
license = "LGPL-3.0-only"
description = "Infrastructure components for the OrderHub trading core"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_infrastructure"
crate-type = ["rlib"]

[features]
default = ["redis"] # Retained integration; activation requires a dedicated service gate.
redis = ["dep:redis", "tls"]
postgres = ["dep:sqlx"]
postgres-tls = ["postgres", "tls", "sqlx/tls-rustls-custom-provider"]
tls = ["dep:rustls", "dep:rustls-graviola"]

[package.metadata.docs.rs]
features = ["postgres", "redis"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
rmp-serde = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ustr = { workspace = true }

redis = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-graviola = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
tokio-rustls = { workspace = true }
tempfile = { workspace = true }
nautilus-model = { workspace = true, features = ["test-support"] }

criterion = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }

[[bench]]
name = "redis_msgbus"
harness = false
required-features = ["redis"]
