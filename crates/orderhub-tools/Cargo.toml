[package]
autoexamples = false
name = "orderhub-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["OrderHub maintainers"]
license.workspace = true
description = "Maintenance and repository checks for OrderHub"

[lints]
workspace = true

[features]
default = ["database", "checks"]
database = ["dep:nautilus-infrastructure", "dep:sha2", "dep:tokio"]
checks = ["dep:regex", "dep:serde_json", "dep:toml", "dep:unicode-width"]
high-precision = ["nautilus-model?/high-precision"]
legacy-catalog = [
  "dep:arrow",
  "dep:blake3",
  "dep:bytes",
  "dep:indexmap",
  "dep:nautilus-core",
  "dep:nautilus-model",
  "dep:parquet",
  "dep:rust_decimal",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:ustr",
]

[[bin]]
name = "orderhub-db"
path = "src/main.rs"
required-features = ["database"]

[[bin]]
name = "orderhub-check"
path = "src/check/main.rs"
required-features = ["checks"]

[[bin]]
name = "orderhub-migrate"
path = "src/legacy/main.rs"
required-features = ["legacy-catalog"]
doc = false

[dependencies]
nautilus-infrastructure = { workspace = true, features = ["postgres"], optional = true }
nautilus-core = { workspace = true, optional = true }
nautilus-model = { workspace = true, optional = true }

anyhow = { workspace = true }
arrow = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
clap = { workspace = true }
indexmap = { workspace = true, optional = true }
parquet = { workspace = true, default-features = false, features = ["snap", "zstd"], optional = true }
regex = { workspace = true, optional = true, features = ["unicode-case"] }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
unicode-width = { version = "0.2.2", default-features = false, optional = true }
ustr = { workspace = true, optional = true }

[dev-dependencies]
nautilus-model = { workspace = true, features = ["test-support"] }

rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }
