[package]
autoexamples = false
name = "nautilus-execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Nautech Systems"]
license = "LGPL-3.0-only"
description = "Core execution machinery for the OrderHub trading core"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_execution"
crate-type = ["rlib"]

[features]
default = []
simulation = ["dep:madsim", "nautilus-core/simulation"]
high-precision = ["nautilus-model/high-precision"]

[package.metadata.docs.rs]
features = ["high-precision", "simulation"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
ustr = { workspace = true }
uuid = { workspace = true }

madsim = { workspace = true, optional = true }

[dev-dependencies]
nautilus-model = { workspace = true, features = ["test-support"] }

bytes = { workspace = true }
criterion = { workspace = true }
parking_lot = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "matching_core"
path = "benches/matching_core.rs"
harness = false

[[bench]]
name = "matching_engine"
path = "benches/matching_engine.rs"
harness = false

[[bench]]
name = "position_replay"
path = "benches/position_replay.rs"
harness = false
