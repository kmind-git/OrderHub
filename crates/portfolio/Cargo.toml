[package]
autoexamples = false
name = "nautilus-portfolio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Portfolio components and functionality for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_portfolio"
crate-type = ["rlib"]

[features]
default = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true }


ahash = { workspace = true }
anyhow = { workspace = true }
bon = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
nautilus-model = { workspace = true, features = ["test-support"] }

criterion = { workspace = true }
rstest = { workspace = true }

[[bench]]
name = "portfolio"
path = "benches/portfolio.rs"
harness = false
