[package]
autoexamples = false
name = "nautilus-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "LGPL-3.0-only"
description = "Core data handling machinery for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_data"
crate-type = ["rlib"]

[features]
default = []
high-precision = [
  "nautilus-model/high-precision"]
defi = [
  "nautilus-common/defi",
  "nautilus-model/defi",
  "alloy-primitives"]

[package.metadata.docs.rs]
features = ["defi", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ustr = { workspace = true }

alloy-primitives = { workspace = true, optional = true }

[dev-dependencies]
nautilus-model = { workspace = true, features = ["test-support"] }

criterion = { workspace = true }
parking_lot = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }

# Run with `cargo bench -p nautilus-data --bench engine`
[[bench]]
name = "engine"
harness = false

# Run with `cargo bench -p nautilus-data --bench aggregation`
[[bench]]
name = "aggregation"
harness = false
