[package]
autoexamples = false
name = "orderhub-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "LGPL-3.0-only"
description = "OrderHub node: assembles the kernel, bridge, journal, and gRPC server"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
base64 = { workspace = true }

[features]
default = []
redis = ["dep:nautilus-infrastructure", "nautilus-infrastructure/redis"]
postgres = ["dep:nautilus-infrastructure", "nautilus-infrastructure/postgres"]
postgres-tls = ["postgres", "nautilus-infrastructure/postgres-tls"]
grpc-tls = ["orderhub-gateway/grpc-tls"]

[[bin]]
name = "orderhub-node"
path = "src/main.rs"

[[bin]]
name = "orderhub-client"
path = "src/bin/client.rs"

[dependencies]
nautilus-infrastructure = { workspace = true, optional = true }
blake3 = { workspace = true }
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true }
nautilus-portfolio = { workspace = true }
nautilus-risk = { workspace = true }

orderhub-gateway = { path = "../orderhub-gateway" }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
orderhub-proto = { path = "../orderhub-proto" }

tokio = { version = "1.53.1", default-features = false, features = [
  "signal",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tonic = { version = "0.14.6", default-features = false, features = [
  "channel",
  "codegen",
  "router",
  "server",
  "transport",
] }

[[bin]]
name = "orderhub-recovery"
path = "src/bin/recovery.rs"
