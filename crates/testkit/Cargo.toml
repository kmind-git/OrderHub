[package]
autoexamples = false
name = "nautilus-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "LGPL-3.0-only"
description = "Testing utilities for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_testkit"
crate-type = ["rlib"]

[features]
default = ["cache"]
cache = [
  "dep:ahash",
  "dep:anyhow",
  "dep:async-trait",
  "dep:bytes",
  "dep:indexmap",
  "dep:nautilus-model",
  "dep:ustr"]
high-precision = [
  "nautilus-model?/high-precision"]

[package.metadata.docs.rs]
features = ["high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true, features = [
  "test-support",
], optional = true }

parking_lot = { workspace = true }
tokio = { workspace = true }

ahash = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
ustr = { workspace = true, optional = true }


[dev-dependencies]
nautilus-model = { workspace = true, features = ["test-support"] }

rstest = { workspace = true }
