[package]
autoexamples = false
name = "nautilus-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Nautech Systems"]
license = "LGPL-3.0-only"
description = "Domain model for the OrderHub trading core"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_model"
crate-type = ["rlib", "staticlib"]

[features]
default = []
ffi = ["nautilus-core/ffi"]
test-support = ["rstest"]
high-precision = []
# DeFi domain model requires 18-decimal wei precision, implying `high-precision`
defi = ["alloy-primitives", "high-precision"]

[package.metadata.docs.rs]
features = ["defi", "ffi", "high-precision", "test-support"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-core = { workspace = true }
nautilus-macros = { workspace = true }

ahash = { workspace = true }
anyhow = { workspace = true }
bon = { workspace = true }
dashmap.workspace = true
derive_builder = { workspace = true }
enum_dispatch = { workspace = true }
implied-vol = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
ruint = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
strum = { workspace = true }
tabled = { workspace = true }
thiserror = { workspace = true }
ustr = { workspace = true }

alloy-primitives = { workspace = true, optional = true }
rstest = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
rmp-serde = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "greeks_criterion"
path = "benches/greeks_criterion.rs"
harness = false

[[bench]]
name = "black_scholes_criterion"
path = "benches/black_scholes_criterion.rs"
harness = false

[[bench]]
name = "book_analysis_criterion"
path = "benches/book_analysis_criterion.rs"
harness = false

[[bench]]
name = "book_iai"
path = "benches/book_iai.rs"
harness = false

[[bench]]
name = "fixed_precision_criterion"
path = "benches/fixed_precision_criterion.rs"
harness = false

[[bench]]
name = "fixed_precision_iai"
path = "benches/fixed_precision_iai.rs"
harness = false

[[bench]]
name = "f64_vs_decimal_to_price_quantity"
path = "benches/f64_vs_decimal_to_price_quantity.rs"
harness = false

[[bench]]
name = "money_criterion"
path = "benches/money_criterion.rs"
harness = false

[[bench]]
name = "price_criterion"
path = "benches/price_criterion.rs"
harness = false

[[bench]]
name = "quantity_criterion"
path = "benches/quantity_criterion.rs"
harness = false

[[bench]]
name = "expressions_criterion"
path = "benches/expressions_criterion.rs"
harness = false

[[bench]]
name = "order_fills_criterion"
path = "benches/order_fills_criterion.rs"
harness = false

[[bench]]
name = "position_replay_criterion"
path = "benches/position_replay_criterion.rs"
harness = false
